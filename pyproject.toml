[project]
name = "abliteration-walkthrough"
version = "0.1.0"
description = "Abliterate Qwen2.5-0.5B-Instruct on a Mac, one step at a time, with the math visible."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "torch>=2.4",
  "transformers>=4.45,<5",
  "accelerate",
  "safetensors",
  "huggingface_hub",
  "datasets",
  "numpy",
  "scikit-learn",
  "matplotlib",
  "plotext==5.3.2",
  "rich",
  "tqdm",
  "gguf",
  "sentencepiece>=0.2.2",
]

[tool.uv]
package = false
